<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Nikhil Kumar, full-stack developer building AI agents and Web3">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#11142b"/>
      <stop offset="1" stop-color="#1b1036"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf5c9"/>
      <stop offset="0.5" stop-color="#7aa7ff"/>
      <stop offset="1" stop-color="#c58bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7a5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7a5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="280" rx="20"/></clipPath>
    <style>
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .line { opacity: 0; animation: show 0.4s ease forwards; }
      .l1 { animation-delay: 0.3s; } .l2 { animation-delay: 0.9s; } .l3 { animation-delay: 1.3s; }
      .l4 { animation-delay: 1.7s; } .l5 { animation-delay: 2.1s; } .l6 { animation-delay: 2.6s; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .orbit { transform-origin: 900px 40px; animation: spin 24s linear infinite; }
      @keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .line { animation: none; opacity: 1; } .cursor, .orbit { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
    <rect width="1000" height="280" fill="url(#glow)"/>
    <g class="orbit" fill="none" stroke="#9b8cff" stroke-opacity="0.18">
      <circle cx="900" cy="40" r="120"/>
      <circle cx="900" cy="40" r="170" stroke-dasharray="4 10"/>
      <circle cx="1020" cy="40" r="4" fill="#9b8cff" fill-opacity="0.6" stroke="none"/>
    </g>
  </g>

  <!-- left: identity -->
  <g class="sans">
    <text x="56" y="78" fill="#8b93b8" font-size="15" letter-spacing="3">HI THERE, I'M</text>
    <text x="54" y="132" fill="url(#ink)" font-size="54" font-weight="800">Nikhil Kumar</text>
    <text x="56" y="168" fill="#d7dcf5" font-size="19">Full-stack developer · AI agents · Web3</text>
    <g font-size="13" fill="#c9cff0">
      <rect x="56" y="196" width="148" height="30" rx="15" fill="#7cf5c9" fill-opacity="0.12" stroke="#7cf5c9" stroke-opacity="0.45"/>
      <text x="130" y="216" text-anchor="middle">Building at Shardeum</text>
      <rect x="214" y="196" width="196" height="30" rx="15" fill="#7aa7ff" fill-opacity="0.12" stroke="#7aa7ff" stroke-opacity="0.45"/>
      <text x="312" y="216" text-anchor="middle">Open source · UseAgent</text>
    </g>
  </g>

  <!-- right: terminal -->
  <g transform="translate(560 44)">
    <rect width="392" height="192" rx="12" fill="#070a16" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="18" r="5" fill="#febc2e"/>
    <circle cx="56" cy="18" r="5" fill="#28c840"/>
    <text x="196" y="22" text-anchor="middle" class="mono" font-size="11" fill="#5b6390">~/useagent</text>
    <g class="mono" font-size="13">
      <text x="20" y="56" class="line l1"><tspan fill="#7cf5c9">$</tspan><tspan fill="#d7dcf5"> gh pr list --author coolestnick</tspan></text>
      <text x="20" y="82" class="line l2" fill="#8b93b8"><tspan fill="#c58bff">✓ merged</tspan>  #406 Keep the Terminal's shell</text>
      <text x="20" y="104" class="line l3" fill="#8b93b8"><tspan fill="#c58bff">✓ merged</tspan>  #399 Phone side panel dialog</text>
      <text x="20" y="126" class="line l4" fill="#8b93b8"><tspan fill="#c58bff">✓ merged</tspan>  #393 Screen reader announcer</text>
      <text x="20" y="148" class="line l5" fill="#8b93b8"><tspan fill="#7aa7ff">… 13 merged</tspan>, 1 in review</text>
      <text x="20" y="174" class="line l6"><tspan fill="#7cf5c9">$</tspan><tspan class="cursor" fill="#d7dcf5"> ▋</tspan></text>
    </g>
  </g>
</svg>
